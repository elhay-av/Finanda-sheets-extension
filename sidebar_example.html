<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Modern Premium Design System */
    :root {
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --primary: #4285F4;
      --primary-hover: #357ae8;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --success: #10b981;
      --error: #ef4444;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }

    body {
      font-family: 'Outfit', sans-serif;
      margin: 0;
      padding: 16px;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 360px;
    }

    /* Sleek Glassmorphic Card */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.8);
      padding: 24px;
      box-sizing: border-box;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Pulsing Chrome Icon Container */
    .icon-container {
      width: 64px;
      height: 64px;
      background: rgba(66, 133, 244, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
      animation: pulse 2.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(66, 133, 244, 0.3); }
      50% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(66, 133, 244, 0); }
    }

    .title {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 8px 0;
      text-align: center;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0 0 20px 0;
      line-height: 1.5;
      text-align: center;
    }

    .divider {
      height: 1px;
      background: var(--border-color);
      margin: 20px 0;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      box-sizing: border-box;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      transition: all 0.2s ease;
      background: #f8fafc;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.15);
    }

    /* Buttons */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #4285F4, #3b82f6);
      color: white;
      text-decoration: none;
      font-weight: 500;
      border-radius: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(66, 133, 244, 0.25);
      border: none;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #357ae8, #2563eb);
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(66, 133, 244, 0.35);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      background: #cbd5e1;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 10px;
      background: transparent;
      color: var(--primary);
      border: 1.5px solid var(--primary);
      font-weight: 500;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s ease;
      font-size: 13px;
    }

    .btn-secondary:hover {
      background: rgba(66, 133, 244, 0.05);
    }

    /* Status Callouts */
    #status {
      margin-top: 16px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
      text-align: left;
      line-height: 1.4;
    }

    .success { background-color: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .error { background-color: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .info { background-color: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }

    #dataOutput {
      margin-top: 16px;
      white-space: pre-wrap;
      background: #f1f5f9;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      border-radius: 8px;
      display: none;
      overflow-x: auto;
      max-height: 150px;
      border: 1px solid #e2e8f0;
    }

    /* UI Toggles */
    #extension-warning-panel { display: none; }
    #main-app-panel { display: none; }
    #mfaSection { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-color); }
    
    /* Invisible Bridge */
    #bridge-area { display: none; }
  </style>
</head>
<body>

  <!-- Invisible DOM Bridge Elements needed by content.js -->
  <div id="bridge-area">
    <input type="text" id="finanda-req-input">
    <button id="finanda-req-btn">Req</button>
    <input type="text" id="finanda-res-input">
    <button id="finanda-res-btn">Res</button>
  </div>

  <div class="container">
    
    <!-- 1. Beautiful "Extension Required" Panel -->
    <div id="extension-warning-panel" class="card">
      <div class="icon-container">
        <svg viewBox="0 0 24 24" width="36" height="36">
          <path fill="#4285F4" d="M12 0C8.2 0 4.9 2.1 3.2 5.2l3.9 6.8c.4-1.9 2.1-3.3 4.1-3.3h9.3c-.9-5.1-5.3-8.7-10.5-8.7z"/>
          <path fill="#EA4335" d="M22.5 8.7h-9.3c-1.3 0-2.5.7-3.2 1.8l-4.7 8.1c3.1 3.3 8 4.4 12.2 2.6 4.2-1.8 7-5.9 7-10.5 0-.7-.1-1.3-.2-2z"/>
          <path fill="#FBBC05" d="M11.2 24c4.3 0 8.1-2.4 9.9-6L17.2 11c-.5 1.1-1.6 1.8-2.9 1.8H5.3c-.2.9-.3 1.9-.3 2.9 0 4.9 3.6 9 8.3 9.3z"/>
          <circle cx="12" cy="12" r="3" fill="#4285F4"/>
        </svg>
      </div>
      
      <h3 class="title">Extension Required</h3>
      <p class="subtitle">Please install the companion Chrome Extension to safely sync your Finanda data directly into Google Sheets.</p>
      
      <div class="divider"></div>
      
      <a href="https://chromewebstore.google.com/detail/dnbacegljccdmiihpcackcicphjbdjkf" 
         target="_blank" 
         rel="noopener noreferrer" 
         class="btn-primary">
        <span>Install Extension</span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </a>

      <button id="recheck-btn" class="btn-secondary">I installed it. Recheck!</button>
    </div>

    <!-- 2. Main Budget Manager Panel -->
    <div id="main-app-panel" class="card">
      <h3 class="title">Finanda Export</h3>
      <p class="subtitle" style="margin-bottom: 12px;">Fetch your budget data safely using your extension connection.</p>
      
      <div id="loginSection">
        <div class="form-group">
          <label for="username">Email/Username:</label>
          <input type="text" id="username" placeholder="elhayav@gmail.com">
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password">
        </div>
        <button id="loginBtn" class="btn-primary">Fetch Data from Finanda</button>
      </div>

      <div id="mfaSection">
        <div class="form-group">
          <label for="mfaCode">Enter SMS Code:</label>
          <input type="text" id="mfaCode">
        </div>
        <button id="verifyMfaBtn" class="btn-primary">Verify & Fetch</button>
      </div>

      <div id="status"></div>
      <div id="dataOutput"></div>
    </div>

  </div>

  <script>
    // State to hold session if MFA is required
    let currentSession = null;
    let currentUsername = null;
    let currentPassword = null;

    const statusDiv = document.getElementById('status');
    const dataOutputDiv = document.getElementById('dataOutput');
    const loginSection = document.getElementById('loginSection');
    const mfaSection = document.getElementById('mfaSection');

    function setStatus(msg, type) {
      statusDiv.textContent = msg;
      statusDiv.className = type;
      statusDiv.style.display = 'block';
    }

    function showData(data) {
      dataOutputDiv.textContent = JSON.stringify(data, null, 2);
      dataOutputDiv.style.display = 'block';
    }

    /**
     * Helper to send messages to the Chrome Extension content script using the DOM click bridge.
     */
    function sendToExtension(action, payload) {
      return new Promise((resolve, reject) => {
        const reqBtn = document.getElementById("finanda-req-btn");
        const reqInput = document.getElementById("finanda-req-input");
        const resBtn = document.getElementById("finanda-res-btn");
        const resInput = document.getElementById("finanda-res-input");

        if (!reqBtn || !reqInput || !resBtn || !resInput) {
          reject(new Error("Bridge elements not loaded."));
          return;
        }

        // Set up the listener for the response trigger
        const responseHandler = () => {
          resBtn.removeEventListener("click", responseHandler);
          try {
            const data = JSON.parse(resInput.value);
            if (data && data.action === action) {
              resolve(data.payload);
            } else {
              reject(new Error("Mismatched action response."));
            }
          } catch (err) {
            reject(err);
          }
        };

        resBtn.addEventListener("click", responseHandler);

        // Send the payload through the input
        reqInput.value = JSON.stringify({ action: action, ...payload });
        reqBtn.click();
      });
    }

    /**
     * Smart detector: Check if extension is installed by sending a FINANDA_PING action
     */
    function verifyExtensionInstalled() {
      return new Promise((resolve) => {
        const reqBtn = document.getElementById("finanda-req-btn");
        const reqInput = document.getElementById("finanda-req-input");
        const resBtn = document.getElementById("finanda-res-btn");
        const resInput = document.getElementById("finanda-res-input");

        if (!reqBtn || !reqInput || !resBtn || !resInput) {
          resolve(false);
          return;
        }

        const responseHandler = () => {
          resBtn.removeEventListener("click", responseHandler);
          clearTimeout(timeoutId);
          try {
            const data = JSON.parse(resInput.value);
            if (data && data.action === "FINANDA_PING" && data.payload.status === "PONG") {
              resolve(true);
              return;
            }
          } catch(e) {}
          resolve(false);
        };

        resBtn.addEventListener("click", responseHandler);

        reqInput.value = JSON.stringify({ action: "FINANDA_PING" });
        reqBtn.click();

        // 800ms timeout for extension detection
        const timeoutId = setTimeout(() => {
          resBtn.removeEventListener("click", responseHandler);
          resolve(false);
        }, 800);
      });
    }

    /**
     * Toggle UI based on extension connection status
     */
    async function runConnectionCheck() {
      const isInstalled = await verifyExtensionInstalled();
      
      const warningPanel = document.getElementById("extension-warning-panel");
      const mainAppPanel = document.getElementById("main-app-panel");

      if (isInstalled) {
        warningPanel.style.display = "none";
        mainAppPanel.style.display = "block";
      } else {
        warningPanel.style.display = "block";
        mainAppPanel.style.display = "none";
      }
    }

    // Initialize connection check on load
    window.addEventListener("DOMContentLoaded", runConnectionCheck);

    // Recheck button interaction
    document.getElementById("recheck-btn").addEventListener("click", async () => {
      const recheckBtn = document.getElementById("recheck-btn");
      recheckBtn.textContent = "Checking...";
      recheckBtn.disabled = true;
      
      await runConnectionCheck();
      
      recheckBtn.textContent = "I installed it. Recheck!";
      recheckBtn.disabled = false;
    });

    /* --- Form Event Listeners --- */

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (!username || !password) {
        setStatus("Please enter username and password", "error");
        return;
      }

      currentUsername = username;
      currentPassword = password;

      setStatus("Logging in to Finanda...", "info");
      document.getElementById('loginBtn').disabled = true;

      try {
        const response = await sendToExtension('FINANDA_LOGIN', { username, password });
        
        document.getElementById('loginBtn').disabled = false;

        if (response.status === 'SUCCESS') {
          setStatus("Login & Fetch Successful!", "success");
          showData(response.data);
        } else if (response.status === 'MFA_REQUIRED') {
          currentSession = response.session;
          setStatus("MFA Code sent to your phone. Please enter it below.", "info");
          loginSection.style.display = 'none';
          mfaSection.style.display = 'block';
        } else {
          setStatus("Login Failed: " + (response.message || "Unknown error"), "error");
        }
      } catch (err) {
        document.getElementById('loginBtn').disabled = false;
        setStatus("Communication error with extension", "error");
        console.error(err);
      }
    });

    document.getElementById('verifyMfaBtn').addEventListener('click', async () => {
      const mfaCode = document.getElementById('mfaCode').value;

      if (!mfaCode) {
        setStatus("Please enter the MFA code", "error");
        return;
      }

      setStatus("Verifying MFA...", "info");
      document.getElementById('verifyMfaBtn').disabled = true;

      try {
        const response = await sendToExtension('FINANDA_MFA_VERIFY', { 
            session: currentSession, 
            mfaCode: mfaCode,
            username: currentUsername,
            password: currentPassword
        });
        
        document.getElementById('verifyMfaBtn').disabled = false;

        if (response.status === 'SUCCESS') {
          setStatus("MFA Verification & Fetch Successful!", "success");
          mfaSection.style.display = 'none';
          loginSection.style.display = 'block'; // Reset UI
          showData(response.data);
        } else {
          setStatus("MFA Verification Failed: " + (response.message || "Unknown error"), "error");
        }
      } catch (err) {
        document.getElementById('verifyMfaBtn').disabled = false;
        setStatus("Communication error with extension", "error");
        console.error(err);
      }
    });
  </script>
</body>
</html>
